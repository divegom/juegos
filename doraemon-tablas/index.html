<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Bolsillo de las Tablas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: una columna centrada sobre un cielo de día con nubes (el barrio de Nobita). Cada minijuego es una pantalla que sustituye a la anterior. Estética única y clara, elegida a propósito: azul Doraemon, rojo collar y amarillo cascabel. */
:root {
  color-scheme: light;
  --sky: #bfe6ff;
  --sky-2: #eaf7ff;
  --panel: #ffffff;
  --panel-2: #f2f8fd;
  --line: #c9e0f1;
  --ink: #12324a;
  --muted: #557087;
  --blue: #1597e5;
  --blue-deep: #0b5f9e;
  --red: #e5332a;
  --bell: #ffc928;
  --bell-deep: #d99a00;
  --dora: #b8742b;
  --ok: #23a565;
  --ok-bg: #e2f7ec;
  --bad: #d93b3f;
  --bad-bg: #fde7e7;
  --font-display: "Fredoka", "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
  --r: 18px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 55%, #f7fbff 100%) fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  overflow-x: hidden;
}
#clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
#clouds i { position: absolute; display: block; width: 160px; height: 46px; background: #fff; border-radius: 999px; opacity: .85; animation: drift linear infinite; }
#clouds i::before, #clouds i::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
#clouds i::before { width: 70px; height: 70px; left: 22px; top: -34px; }
#clouds i::after { width: 54px; height: 54px; left: 78px; top: -22px; }
@keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(110vw); } }
@media (prefers-reduced-motion: reduce) { #clouds i { animation: none; } }
#app { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; font-weight: 700; }

/* Cabecera */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 14px; }
.brand { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 10px; text-align: left; }
.brand-mark { width: 44px; height: 44px; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; color: var(--blue-deep); display: block; line-height: 1.05; }
.brand small { color: var(--muted); font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; }
.status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 800; font-size: .9rem; min-height: 38px; }
.chip .mini { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: var(--panel-2); display: block; }
.face { position: relative; display: block; width: 100%; height: 100%; overflow: hidden; border-radius: 50%; background: #fff; }
.face img { position: absolute; max-width: none; height: auto; display: block; }
.pic { display: block; height: auto; max-width: none; }
.chip.dora { color: var(--dora); font-variant-numeric: tabular-nums; padding-left: 8px; }
.chip.dora svg { width: 26px; height: 18px; }
.chip.dora.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.18); } }
.icon-btn { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 1rem; padding: 0; }

/* Comunes */
.screen { display: grid; gap: 18px; animation: rise .3s ease both; }
@keyframes rise { from { opacity: .4; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: 0 4px 0 var(--line); }
.back { justify-self: start; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; color: var(--blue-deep); font-weight: 800; padding: 6px 14px; }
.back:hover { border-color: var(--blue); }
.eyebrow { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--red); font-weight: 900; margin: 0; }
.lead { color: var(--muted); max-width: 62ch; margin: 6px 0 0; }
.btn { border-radius: 14px; padding: 12px 20px; font-weight: 900; font-size: 1rem; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn:hover { border-color: var(--blue); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.main { background: var(--blue); color: #fff; border-color: var(--blue-deep); box-shadow: 0 3px 0 var(--blue-deep); }
.btn.main:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.center { text-align: center; justify-items: center; }

/* Portada */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 16px; align-items: center; overflow: hidden; position: relative; background: linear-gradient(160deg, #fff 55%, #e3f3ff); }
.hero h1 { font-size: clamp(1.7rem, 4.6vw, 2.6rem); line-height: 1.08; color: var(--ink); }
.hero h1 span { color: var(--blue); }
.hero .me { display: flex; gap: 12px; align-items: center; }
.me-face { width: 64px; height: 64px; flex: none; border-radius: 50%; border: 3px solid var(--bell); background: var(--panel-2); overflow: hidden; padding: 0; }

.me-sub { margin: 2px 0 0; color: var(--muted); font-weight: 800; font-size: .92rem; }
.link { background: none; border: 0; padding: 0; color: var(--blue-deep); text-decoration: underline; font-weight: 800; }
.rank-name { font-family: var(--font-display); font-weight: 700; color: var(--blue-deep); font-size: 1.1rem; }
.bar { height: 14px; border-radius: 999px; background: var(--panel-2); border: 2px solid var(--line); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--bell), #ffe27a); border-radius: inherit; transition: width .5s ease; }
.bar-label { font-size: .85rem; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; font-weight: 700; }
.dora-hero { position: relative; display: grid; justify-items: center; }
.dora-hero .hero-pic { width: 150px; }
.bubble { position: relative; margin: 0 0 10px; background: var(--panel); border: 2px solid var(--blue); border-radius: 16px; padding: 10px 12px; font-size: .9rem; color: var(--ink); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 16px; height: 16px; background: var(--panel); border-right: 2px solid var(--blue); border-bottom: 2px solid var(--blue); transform: translateX(-50%) rotate(45deg); }
.bubble b { display: block; color: var(--blue-deep); font-family: var(--font-display); font-size: .9rem; margin-bottom: 2px; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.mode { text-align: left; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: 0 4px 0 var(--line); transition: transform .15s, border-color .15s; }
.mode:hover { transform: translateY(-3px); border-color: var(--blue); }
.mode h3 { font-size: 1.2rem; color: var(--blue-deep); }
.mode p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
.mode .art { width: 84px; height: 84px; border-radius: 50%; background: var(--panel-2); border: 3px solid var(--bell); overflow: hidden; display: grid; place-items: center; }
.mode .art > svg { width: 100%; height: 100%; display: block; }
.mode .art.pad svg { width: 78%; height: 78%; }
.mode.big { grid-column: 1 / -1; background: linear-gradient(120deg, #fff 40%, #e2f2ff); }
.extras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.extra { text-align: left; background: rgba(255,255,255,.6); border: 2px dashed var(--line); border-radius: var(--r); padding: 14px 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.extra:hover { border-color: var(--blue); }
.extra span { color: var(--muted); font-weight: 700; font-size: .9rem; }

/* Selectores */
.picker { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.pick { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 6px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--blue-deep); box-shadow: 0 3px 0 var(--line); }
.pick:hover { border-color: var(--blue); }
.pick small { display: block; font-family: var(--font-body); font-size: .72rem; color: var(--muted); font-weight: 800; }
.pick.wide { grid-column: span 5; font-size: 1.05rem; }
.pick.wide2 { grid-column: span 5; font-size: 1.05rem; }
@media (min-width: 560px) { .pick.wide, .pick.wide2 { grid-column: span 2; } .pick.wide2 { grid-column: span 3; } }
.speed { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.speed button { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 6px; font-weight: 900; }
.speed button small { display: block; font-weight: 700; color: var(--muted); font-size: .75rem; }
.speed button[aria-pressed="true"] { border-color: var(--blue); background: #e2f2ff; color: var(--blue-deep); }

/* Juego: pregunta y teclado */
.play { display: grid; gap: 14px; justify-items: center; }
.q { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 9vw, 3.6rem); line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; text-align: center; }
.q .ans { display: inline-block; min-width: 2.2em; border-bottom: 4px solid var(--blue); color: var(--blue); }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(100%, 320px); }
.key { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 0; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; box-shadow: 0 3px 0 var(--line); color: var(--ink); }
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.key.alt { color: var(--muted); }
.key.ok { background: var(--blue); color: #fff; border-color: var(--blue-deep); box-shadow: 0 3px 0 var(--blue-deep); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(100%, 420px); }
.opt { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 14px 0; font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; color: var(--ink); box-shadow: 0 3px 0 var(--line); font-variant-numeric: tabular-nums; }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { min-height: 1.6em; text-align: center; font-weight: 800; margin: 0; max-width: 46ch; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }
.hint { background: var(--panel-2); border: 2px dashed var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; justify-items: center; max-width: 100%; }
.hint p { margin: 0; text-align: center; }
.dgrid { display: grid; gap: 3px; max-width: 100%; }
.dgrid i { width: 16px; height: 11px; border-radius: 50% / 60%; background: radial-gradient(ellipse at 50% 30%, #e2a85a, var(--dora) 70%); box-shadow: inset 0 -2px 0 #6b3a14; display: block; }
.skip { color: var(--muted); font-size: .92rem; }
.skip span { font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); display: block; }
.dots i.ok { background: var(--ok); border-color: var(--ok); }
.dots i.bad { background: var(--bad); border-color: var(--bad); }
.dots i.now { border-color: var(--blue); box-shadow: 0 0 0 3px #cbe8fb; }
.pals { display: flex; align-items: flex-end; gap: 4px; }
.pals .pic { height: 84px; width: auto; filter: drop-shadow(0 2px 0 rgba(255,255,255,.9)); }

/* Máquina del tiempo */
.eras { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.era { text-align: left; padding: 0; background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: 0 4px 0 var(--line); display: grid; }
.era:hover:not(:disabled) { border-color: var(--blue); transform: translateY(-2px); }
.era svg.scene { width: 100%; height: auto; display: block; aspect-ratio: 5 / 2; }
.era .info { padding: 10px 12px 12px; display: grid; gap: 2px; }
.era h3 { font-size: 1.05rem; color: var(--blue-deep); }
.era p { margin: 0; color: var(--muted); font-size: .85rem; font-weight: 700; }
.era:disabled { cursor: not-allowed; }
.era:disabled svg.scene { filter: grayscale(1) opacity(.45); }
.era .lock { color: var(--muted); }
.stars { color: var(--bell); letter-spacing: .05em; font-size: 1rem; }
.stars .off { color: #d6e2ec; }
.stage-top { position: relative; width: 100%; max-width: 620px; justify-self: center; border-radius: var(--r); overflow: hidden; border: 2px solid var(--line); }
.stage-top svg.scene { width: 100%; height: auto; display: block; aspect-ratio: 5 / 2; }
.stage-top .pals { position: absolute; left: 10px; bottom: 6px; }
.stage-top h2 { position: absolute; right: 10px; top: 10px; background: rgba(255,255,255,.92); padding: 4px 12px; border-radius: 999px; font-size: 1rem; color: var(--blue-deep); }
.tunnel { position: relative; height: 34px; width: 100%; border-radius: 999px; overflow: hidden; background: repeating-linear-gradient(115deg, #7b5cff 0 18px, #3fc1ff 18px 36px, #ff7ad9 36px 54px); background-size: 200% 100%; animation: tunnel 6s linear infinite; border: 2px solid var(--blue-deep); }
@keyframes tunnel { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .tunnel { animation: none; } }
.tunnel .tm { position: absolute; top: 50%; width: 58px; height: 30px; transform: translate(-50%, -50%); transition: left .5s ease; }
.tunnel .goal { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: #fff; border-radius: 999px; font-size: .75rem; font-weight: 900; padding: 1px 8px; color: var(--blue-deep); }

/* Lluvia de dorayakis */
.hud { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; font-weight: 900; }
.hud span { background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.hud .lives { color: var(--red); letter-spacing: .1em; }
.rain { position: relative; width: 100%; height: clamp(250px, 44vh, 440px); border-radius: var(--r); overflow: hidden; border: 2px solid var(--line); background: linear-gradient(180deg, #9fd8ff, #e7f6ff 70%, #bfe3a3 70%, #9ccf7b); }
.drop { position: absolute; top: 0; left: 0; display: grid; place-items: center; width: 92px; height: 54px; will-change: transform; }
.drop svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.drop b { position: relative; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: #fff; text-shadow: 0 2px 0 #6b3a14, 0 0 4px #6b3a14; font-variant-numeric: tabular-nums; }
.drop.pop { animation: pop .35s ease forwards; }
@keyframes pop { to { transform: var(--t) scale(1.6); opacity: 0; } }
.catcher { position: absolute; bottom: 2px; left: 50%; width: 86px; transform: translateX(-50%); }
.catcher .pic { width: 100%; }
.entry { font-family: var(--font-display); font-size: 2rem; font-weight: 700; min-width: 4ch; text-align: center; background: var(--panel); border: 2px solid var(--blue); border-radius: 14px; padding: 2px 14px; min-height: 52px; font-variant-numeric: tabular-nums; color: var(--blue-deep); }
.entry.shake { animation: shake .3s; border-color: var(--bad); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.missed { position: absolute; left: 50%; bottom: 40%; transform: translateX(-50%); background: var(--bad); color: #fff; font-weight: 900; padding: 4px 12px; border-radius: 999px; animation: fade 1.2s forwards; white-space: nowrap; }
@keyframes fade { 70% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -20px); } }

/* Huye de Gigante */
.track { position: relative; width: 100%; height: 150px; border-radius: var(--r); overflow: hidden; border: 2px solid var(--line); background: linear-gradient(180deg, #a8dcff 0 45%, #d8ecc4 45% 62%, #c9b79c 62% 100%); }
.track::after { content: ""; position: absolute; left: 0; right: 0; top: 78%; border-top: 3px dashed rgba(255,255,255,.8); }
.track .fence { position: absolute; left: 0; right: 0; top: 30%; height: 22%; background: repeating-linear-gradient(90deg, #f3ede1 0 10px, #d9cfbb 10px 12px); }
.runner { position: absolute; bottom: 6px; width: 70px; height: 96px; transform: translateX(-50%); transition: left .25s linear; }
.runner .pic { height: 100%; width: auto; margin: 0 auto; }
.runner.g { width: 84px; height: 104px; }
.house { position: absolute; right: 4px; bottom: 16px; width: 96px; }
.house svg { width: 100%; height: auto; display: block; }
.say { font-weight: 900; text-align: center; margin: 0; min-height: 1.5em; color: var(--blue-deep); }
.count { font-family: var(--font-display); font-size: 3rem; color: var(--red); text-align: center; }

/* Puertas mágicas */
.doors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(100%, 560px); margin: 0 auto; }
.door { aspect-ratio: 3 / 4; border-radius: 12px 12px 6px 6px; border: 3px solid #c2437c; background: linear-gradient(180deg, #ff8fc4, #f06aa8); box-shadow: 0 4px 0 #c2437c; position: relative; font-family: var(--font-display); font-weight: 700; font-size: clamp(1rem, 4.5vw, 1.5rem); color: var(--ink); padding: 0; transition: transform .2s; }
.door::after { content: ""; position: absolute; right: 12%; top: 52%; width: 10%; aspect-ratio: 1; border-radius: 50%; background: var(--bell); border: 2px solid var(--bell-deep); }
.door.up { background: #fff; border-color: var(--blue); box-shadow: 0 4px 0 var(--blue-deep); }
.door.up::after, .door.done::after { display: none; }
.door.done { background: var(--ok-bg); border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); color: var(--ok); }
.door .face { display: grid; place-items: center; height: 100%; padding: 4px; line-height: 1.1; }

/* Colección y mapa */
.coll { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.item { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.item svg { width: 72px; height: 72px; }
.item h3 { font-size: 1rem; color: var(--blue-deep); }
.item p { margin: 0; font-size: .8rem; color: var(--muted); font-weight: 700; }
.item.locked svg { filter: grayscale(1) brightness(1.6) opacity(.35); }
.item.locked h3 { color: var(--muted); }
.map-wrap { overflow-x: auto; }
.map { border-collapse: separate; border-spacing: 4px; margin: 0 auto; font-variant-numeric: tabular-nums; }
.map th { font-family: var(--font-display); color: var(--blue-deep); width: 36px; height: 30px; }
.map td { width: 38px; height: 34px; border-radius: 8px; text-align: center; font-weight: 800; font-size: .8rem; background: var(--panel); border: 2px solid var(--line); color: var(--muted); }
.map td.m-gold { background: var(--bell); border-color: var(--bell-deep); color: #4a3200; }
.map td.m-ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.map td.m-bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: .85rem; font-weight: 700; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 2px solid var(--line); }

/* Modal, efectos */
.modal { position: fixed; inset: 0; background: rgba(18, 50, 74, .45); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal-card { background: var(--panel); border: 3px solid var(--blue); border-radius: 22px; padding: 22px; width: min(100%, 440px); display: grid; gap: 12px; justify-items: center; text-align: center; max-height: 90vh; overflow-y: auto; animation: rise .25s ease; }
.modal-card h2 { color: var(--blue-deep); font-size: 1.5rem; }
.modal-card p { margin: 0; color: var(--muted); }
.modal-card .row { justify-content: center; }
.modal-card .big-art { height: 130px; display: flex; gap: 6px; justify-content: center; }
.modal-card .big-art svg { width: 120px; height: 120px; }
.modal-card .big-art .pic { height: 100%; width: auto; }
.modal-card input { font: inherit; font-size: 1.2rem; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); width: 100%; text-align: center; color: var(--ink); background: var(--panel); }
.pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; width: 100%; }
.pal-btn { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px 6px; display: grid; justify-items: center; gap: 4px; font-weight: 900; }
.pal-btn:hover, .pal-btn[aria-pressed="true"] { border-color: var(--blue); background: #e2f2ff; }
.pal-btn .pic { height: 100px; width: auto; }
.pal-btn small { color: var(--muted); font-weight: 700; font-size: .75rem; }
.spark { position: fixed; z-index: 30; pointer-events: none; font-size: 18px; color: var(--bell); animation: spark .8s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
.plus { position: fixed; z-index: 30; pointer-events: none; font-weight: 900; color: var(--dora); font-size: 1.3rem; animation: up 1s ease-out forwards; }
@keyframes up { to { transform: translateY(-40px); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--blue-deep); color: #fff; font-weight: 900; padding: 10px 18px; border-radius: 999px; z-index: 40; animation: fade 3s forwards; max-width: calc(100% - 32px); text-align: center; }
footer { margin-top: 30px; color: var(--muted); font-size: .8rem; text-align: center; max-width: 70ch; margin-inline: auto; }
footer a { color: var(--blue-deep); }
.ghost-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: .8rem; font-weight: 700; }

@media (max-width: 640px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .dora-hero { grid-template-columns: 110px minmax(0, 1fr); align-items: center; gap: 10px; }
  .dora-hero .hero-pic { width: 96px; grid-row: 1; grid-column: 1; justify-self: center; }
  .dora-hero .bubble { grid-row: 1; grid-column: 2; margin: 0; }
  .dora-hero .bubble::after { left: -10px; top: 50%; bottom: auto; transform: translateY(-50%) rotate(135deg); }
  .modes, .extras { grid-template-columns: minmax(0, 1fr); }
  .mode { grid-template-columns: 64px minmax(0, 1fr); }
  .mode .art { width: 64px; height: 64px; }
  .brand small, .who-rank { display: none; }
  .key { padding: 9px 0; font-size: 1.35rem; }
  .doors { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .runner { width: 56px; height: 80px; }
  .runner.g { width: 66px; height: 88px; }
  .house { width: 74px; }
}
</style>
</head>

const KEY = 'bolsillo-tablas-v1';
const DEF = () => ({ name: '', pal: null, dora: 0, eras: Array(11).fill(0), medals: {}, facts: {}, sound: true, diff: 1, records: {} });
let save = DEF();
try { const raw = localStorage.getItem(KEY); if (raw) save = Object.assign(DEF(), JSON.parse(raw)); } catch (e) {}
save.eras = Array.from({ length: 11 }, (_, i) => +(Array.isArray(save.eras) && save.eras[i]) || 0);
if (!save.medals || typeof save.medals !== 'object') save.medals = {};
if (!save.records || typeof save.records !== 'object') save.records = {};
if (!(save.diff >= 0 && save.diff <= 2)) save.diff = 1;
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

const factKey = (a, b) => Math.min(a, b) + 'x' + Math.max(a, b);

/* Operaciones: set = número (1-10), 'all' o 'weak' */
function pool(set) {
  if (typeof set === 'number') return range(1, 10).map(k => [set, k]);
  if (set === 'weak') { const w = weakFacts(); if (w.length) return w; }
  const out = [];
  for (let a = 2; a <= 10; a++) for (let b = 2; b <= 10; b++) out.push([a, b]);
  return out;
}
function pickFact(set) {
  const p = pool(set);

  return Math.random() < 0.5 ? [a, b] : [b, a];
}
function options(a, b, n = 4) {
  const r = a * b, s = new Set([r]);
  const cand = shuffle([r + a, r - a, r + b, r - b, r + 1, r - 1, r + 10, r - 10, (a + 1) * (b + 1), r + 2]).filter(x => x > 0 && x !== r);
  for (const c of cand) { if (s.size >= n) break; s.add(c); }

}
function explain(a, b) {
  const r = a * b;
  const trick = (x, y) => {
    if (y === 1) return `Cualquier número por 1 da el mismo número: <b>${x} × 1 = ${x}</b>.`;
    if (y === 10) return `Por 10 solo añades un cero: ${x} → <b>${x * 10}</b>.`;
    if (y === 2) return `Por 2 es el doble: ${x} + ${x} = <b>${x * 2}</b>.`;
    if (y === 3) return `Por 3 es sumar tres veces: ${x} + ${x} + ${x} = <b>${x * 3}</b>.`;
    if (y === 4) return `Por 4 es el doble del doble: ${x} → ${x * 2} → <b>${x * 4}</b>.`;
    if (y === 5 && x !== 5) return `Por 5 es la mitad de por 10: ${x} × 10 = ${x * 10}, y la mitad es <b>${x * 5}</b>.`;
    if (y === 9) return `Por 9 es por 10 menos una vez: ${x} × 10 = ${x * 10}, menos ${x} = <b>${x * 9}</b>.`;
    return null;
  };
  const t = trick(a, b) || trick(b, a);
  if (t) return t;
  const big = Math.max(a, b), small = Math.min(a, b);
  if (small === 6 || big === 6) {
    const x = small === 6 ? big : small;
    return `Por 6 es por 5 y una vez más: ${x} × 5 = ${x * 5}, más ${x} = <b>${r}</b>.`;
  }
  if (small === 8 || big === 8) {
    const x = small === 8 ? big : small;
    return `Por 8 es doblar tres veces: ${x} → ${x * 2} → ${x * 4} → <b>${r}</b>.`;
  }
  return `Si ${big} × ${small - 1} = ${big * (small - 1)}, súmale otro ${big}: <b>${r}</b>.`;
}

}

    const first = !save.eras[i];
    const bonus = first ? 15 : 5;
    save.eras[i] = Math.max(save.eras[i], stars); persist();
    addDora(bonus); sfx.win();
    const all = save.eras.every(Boolean);
    let html = `<div class="big-art">${i === 10 ? pic('sensei') : pic('doraemon')}</div><h2>${i === 10 ? '¡Nobita ha sacado un 100!' : '¡Viaje completado!'}</h2>${starsHTML(stars)}
      <p>${st.errors === 0 ? 'Sin ningún fallo. ¡Eres un genio!' : `Has tenido ${st.errors} ${st.errors === 1 ? 'fallo' : 'fallos'}.`} Has ganado ${st.earned + bonus} dorayakis.</p>`;
    if (first) html += `<div class="big-art">${G[e.g]}</div><p><b>¡Nuevo invento: ${e.gn}!</b><br>${e.gd}</p>`;
    if (first && all) html += `<p><b>¡Has completado todos los viajes en el tiempo!</b></p>`;
    const nextOk = i < 10;
    showModal(html, [
      { label: 'Repetir', fn: () => go(travel, i) },
      nextOk ? { label: 'Siguiente viaje', primary: true, fn: () => go(travel, i + 1) } : { label: 'Volver', primary: true, fn: () => go(timeScreen) },
    ]);
  }
  bindKeypad(s, onKey); move(); draw(); fitPlay($('#play'));
}

/* ---------- El pan de la memoria (entrenamiento) ---------- */
function trainSetup() {
  const s = screen(`<div><p class="eyebrow">El pan de la memoria</p><h2>¿Qué tabla quieres practicar?</h2>
    <p class="lead">Diez preguntas con cuatro respuestas para elegir. Sin prisa. Si te atascas, pide una pista y Doraemon te enseña los dorayakis.</p></div>${pickerHTML()}`);
  bindPicker(s, set => go(train, set));
}
function train(set) {
  const qs = [];
  if (typeof set === 'number') shuffle(range(1, 10)).forEach(k => qs.push([set, k]));
  else for (let i = 0; i < 10; i++) qs.push(pickFact(set));
  const st = { n: 0, res: [], tries: 0, earned: 0 };
  const s = screen(`<div class="row" style="justify-content:space-between"><div><p class="eyebrow">Pan de la memoria · ${setName(set)}</p></div>${palsHTML()}</div>
    <div class="panel play" id="play"><div class="dots" id="dots"></div><div class="q" id="q"></div><div class="opts" id="opts"></div>
    <p class="fb" id="fb"></p><button class="btn" id="hintb">💡 Pista</button><div id="hint"></div></div>`, trainSetup, '← Elegir otra tabla');
  function dots() { $('#dots').innerHTML = qs.map((_, i) => `<i class="${st.res[i] === true ? 'ok' : st.res[i] === false ? 'bad' : i === st.n ? 'now' : ''}"></i>`).join(''); }
  function draw() {
    const [a, b] = qs[st.n]; st.tries = 0;
    $('#q').textContent = `${a} × ${b}`;
    $('#opts').innerHTML = options(a, b).map(o => `<button class="opt" data-v="${o}">${o}</button>`).join('');
    $('#opts').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => choose(b)));
    $('#fb').textContent = ''; $('#fb').className = 'fb'; $('#hint').innerHTML = ''; $('#hintb').hidden = false;
    dots();
  }
  function choose(btn) {
    const [a, b] = qs[st.n], v = +btn.dataset.v;
    if (v === a * b) {
      btn.classList.add('ok'); $('#opts').querySelectorAll('.opt').forEach(x => x.disabled = true);
      const plus = st.tries === 0 ? 2 : 1;
      if (st.res[st.n] !== false) st.res[st.n] = true;
      rec(a, b, st.tries === 0); sfx.ok(); burst(btn, plus); st.earned += plus; addDora(plus);
      $('#fb').className = 'fb ok'; $('#fb').innerHTML = st.tries ? `¡Eso es! ${explain(a, b)}` : '¡Correcto! ¡Ñam, un dorayaki!';
      $('#hintb').hidden = true;
      later(() => { st.n++; st.n < qs.length ? draw() : finish(); }, st.tries ? 1800 : 900);
    } else {
      btn.classList.add('bad'); btn.disabled = true; st.tries++; st.res[st.n] = false; sfx.bad();
      $('#fb').className = 'fb bad'; $('#fb').textContent = '¡Casi! Prueba otra vez.';
      if (st.tries === 1) showHint();
      dots();
    }
  }
  function showHint() {
    const [a, b] = qs[st.n];
    $('#hint').innerHTML = `<div class="hint">${a * b <= 60 ? doraGrid(a, b) : ''}${skipCount(a, b)}</div>`;
    $('#hintb').hidden = true;
  }
  $('#hintb').onclick = showHint;
  keyHandler = k => { const i = +k - 1, b = $('#opts').querySelectorAll('.opt')[i]; if (b && !b.disabled) b.click(); };
  function finish() {
    const good = st.res.filter(x => x === true).length;
    const bonus = good === 10 ? 10 : good >= 8 ? 5 : 2;
    addDora(bonus); sfx.win();
    showModal(`<div class="big-art">${G.pan}</div><h2>${good === 10 ? '¡Perfecto!' : good >= 7 ? '¡Muy bien!' : '¡Buen entrenamiento!'}</h2>
      <p>Has acertado ${good} de 10 a la primera y ganado ${st.earned + bonus} dorayakis.</p>`, [
      { label: 'Otra tabla', fn: () => go(trainSetup) },
      { label: 'Repetir', primary: true, fn: () => go(train, set) },
    ]);
  }
  draw(); fitPlay($('#play'));
}

/* ---------- Lluvia de dorayakis ---------- */
function rainSetup() {
  const s = screen(`<div><p class="eyebrow">Lluvia de dorayakis</p><h2>¡Que llueven dorayakis!</h2>
    <p class="lead">Cada dorayaki trae una multiplicación. Escribe el resultado y Doraemon se lo come antes de que toque el suelo. Si caen tres al suelo, se acaba la partida.</p></div>
    ${speedHTML()}<h3>¿Con qué tabla juegas?</h3>${pickerHTML()}`);
  bindSpeed(s);
  bindPicker(s, set => go(rainGame, set));
}
function rainGame(set) {
  const sp = SPEEDS[save.diff];
  const s = screen(`<div class="hud"><span>Puntos: <b id="score">0</b></span><span>Racha: <b id="combo">0</b></span><span class="lives" id="lives" aria-label="Vidas"></span><span>${sp.n}</span></div>
    <div class="rain" id="rain"><div class="catcher" id="catcher">${pic('doraemon')}</div></div>
    <div class="play" id="play"><div class="entry" id="entry" aria-live="polite"></div>${keypadHTML()}</div>`, rainSetup, '← Salir del juego');
  const area = $('#rain'), entryEl = $('#entry'), catcher = $('#catcher');
  const st = { score: 0, combo: 0, lives: 3, entry: '', items: [], next: 0, last: 0, interval: sp.spawn, fall: sp.fall, running: true, raf: 0, caught: 0 };
  const hud = () => { $('#score').textContent = st.score; $('#combo').textContent = st.combo; $('#lives').textContent = '♥'.repeat(st.lives) + '♡'.repeat(3 - st.lives); entryEl.textContent = st.entry; };
  function spawn() {
    let a, b, tries = 0;
    do { [a, b] = pickFact(set); tries++; } while (tries < 10 && st.items.some(it => it.a * it.b === a * b));
    const el = document.createElement('div'); el.className = 'drop';
    el.innerHTML = dorayakiSVG() + `<b>${a} × ${b}</b>`;
    const w = area.clientWidth, x = 6 + rnd(Math.max(10, w - 104));
    area.appendChild(el);
    st.items.push({ a, b, el, x, y: 0 });
  }
  function loop(ts) {
    if (!st.running) return;
    const dt = Math.min(100, ts - (st.last || ts)); st.last = ts;
    if (ts >= st.next) { spawn(); st.next = ts + st.interval; st.interval = Math.max(sp.spawn * 0.55, st.interval * 0.985); st.fall = Math.max(sp.fall * 0.6, st.fall * 0.993); }
    const H = area.clientHeight - 54 - 70;
    for (const it of st.items.slice()) {
      it.y += dt / st.fall;
      it.el.style.transform = `translate(${it.x}px, ${it.y * H}px)`;
      if (it.y >= 1) miss(it);
    }
    if (st.running) st.raf = requestAnimationFrame(loop);
  }
  function miss(it) {
    st.items = st.items.filter(x => x !== it); it.el.remove();
    st.lives--; st.combo = 0; rec(it.a, it.b, false); sfx.bad();
    const m = document.createElement('div'); m.className = 'missed'; m.textContent = `${it.a} × ${it.b} = ${it.a * it.b}`;
    area.appendChild(m); later(() => m.remove(), 1200);
    hud();
    if (st.lives <= 0) end();
  }
  function submit() {
    if (!st.entry) return;
    const v = +st.entry;
    const hits = st.items.filter(it => it.a * it.b === v).sort((x, y) => y.y - x.y);
    if (hits.length) {
      const it = hits[0];
      st.items = st.items.filter(x => x !== it);
      it.el.style.setProperty('--t', it.el.style.transform); it.el.classList.add('pop');
      later(() => it.el.remove(), 350);
      const pts = 10 + st.combo * 2;
      st.score += pts; st.combo++; st.caught++; rec(it.a, it.b, true); sfx.pop(); burst(it.el, pts);
      catcher.style.left = `${it.x + 46}px`;
    } else {
      st.combo = 0; sfx.bad();
      entryEl.classList.remove('shake'); void entryEl.offsetWidth; entryEl.classList.add('shake');
    }
    st.entry = ''; hud();
  }
  function onKey(k) {
    if (!st.running) return;
    if (k === 'del') st.entry = st.entry.slice(0, -1);
    else if (k === 'ok') return submit();
    else if (st.entry.length < 3) st.entry += k;
    hud();
  }
  function end() {
    st.running = false; cancelAnimationFrame(st.raf); keyHandler = null;
    const key = 'rain-' + save.diff, best = save.records[key] || 0, record = st.score > best;
    if (record) save.records[key] = st.score;
    persist();
    const earned = Math.round(st.score / 10);
    addDora(earned); sfx.win();
    const medal = st.score >= 250 ? giveMedal('rain') : '';
    showModal(`<div class="big-art">${pic('doraemon')}</div><h2>${record ? '¡Nuevo récord!' : '¡Fin de la lluvia!'}</h2>
      <p>Has atrapado ${st.caught} dorayakis y conseguido <b>${st.score} puntos</b> en velocidad ${sp.n}. Récord: ${Math.max(best, st.score)}.</p><p>Ganas ${earned} dorayakis.</p>${medal}`, [
      { label: 'Salir', fn: () => go(rainSetup) },
      { label: 'Otra vez', primary: true, fn: () => go(rainGame, set) },
    ]);
  }
  cleanup = () => { st.running = false; cancelAnimationFrame(st.raf); };
  bindKeypad(s, onKey); hud(); fitPlay($('#play'));
  st.next = performance.now() + 700;
  st.raf = requestAnimationFrame(loop);
}

/* ---------- ¡Que viene Gigante! ---------- */
function runSetup() {
  const s = screen(`<div><p class="eyebrow">¡Que viene Gigante!</p><h2>Nobita ha roto el bate de Gigante…</h2>
    <p class="lead">…y Gigante le persigue por el barrio. Cada respuesta correcta hace que Nobita corra hacia su casa. Si fallas, Nobita tropieza. ¡Llega a casa antes de que te pille!</p></div>
    ${speedHTML()}<h3>¿Con qué tabla juegas?</h3>${pickerHTML()}`);
  bindSpeed(s);
  bindPicker(s, set => go(runGame, set));
}
function runGame(set) {
  const sp = SPEEDS[save.diff];
  const s = screen(`<div class="track" id="track"><div class="fence"></div><div class="house">${houseSVG()}</div>
      <div class="runner g" id="gig">${pic('gigante')}</div><div class="runner" id="nob">${pic('nobita')}</div></div>
    <p class="say" id="say">Preparados…</p>
    <div class="panel play" id="play"><div class="q" id="q"></div><div class="opts" id="opts"></div></div>`, runSetup, '← Salir del juego');
  const st = { p: 24, g: 4, running: false, raf: 0, last: 0, ok: 0, bad: 0, lock: false };
  const pos = x => `calc(40px + (100% - 150px) * ${Math.min(100, Math.max(0, x)) / 100})`;
  function draw() { $('#nob').style.left = pos(st.p); $('#gig').style.left = pos(st.g); }
  function nextQ() {
    const [a, b] = pickFact(set); st.q = [a, b]; st.lock = false;
    $('#q').textContent = `${a} × ${b}`;
    $('#opts').innerHTML = options(a, b).map(o => `<button class="opt" data-v="${o}">${o}</button>`).join('');
    $('#opts').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => pick(b)));
  }
  function pick(btn) {
    if (!st.running || st.lock) return;
    st.lock = true;
    const [a, b] = st.q, v = +btn.dataset.v;
    $('#opts').querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.v === a * b) x.classList.add('ok'); });
    if (v === a * b) {
      st.p += 9; st.ok++; rec(a, b, true); sfx.ok(); addDora(1);
      $('#say').textContent = ['¡Corre, Nobita!', '¡Más rápido!', '¡Bien!', '¡Ya casi!'][rnd(4)];
      draw();
      if (st.p >= 100) return win();
      later(nextQ, 250);
    } else {
      btn.classList.add('bad'); st.g += 5; st.bad++; rec(a, b, false); sfx.bad();
      $('#say').textContent = `¡Nobita tropieza! ${a} × ${b} = ${a * b}`;
      draw();
      later(nextQ, 1100);
    }
  }
  function loop(ts) {
    if (!st.running) return;
    const dt = Math.min(100, ts - (st.last || ts)); st.last = ts;
    st.g += sp.run * dt / 1000; draw();
    if (st.g >= st.p - 3) return lose();
    st.raf = requestAnimationFrame(loop);
  }
  function stop() { st.running = false; cancelAnimationFrame(st.raf); keyHandler = null; $('#opts').querySelectorAll('.opt').forEach(x => x.disabled = true); }
  function win() {
    stop();
    const gap = st.p - st.g, stars = gap > 40 ? 3 : gap > 20 ? 2 : 1;
    const earned = 10 + stars * 5;
    addDora(earned); sfx.win();
    const medal = giveMedal('run');
    $('#say').textContent = '¡Nobita ha llegado a casa!';
    later(() => showModal(`<div class="big-art">${pic('nobita')}${pic('doraemon')}</div><h2>¡A salvo en casa!</h2>${starsHTML(stars)}
      <p>Nobita se ha escondido detrás de Doraemon. Has acertado ${st.ok} y ganas ${earned + st.ok} dorayakis en total.</p>${medal}`, [
      { label: 'Salir', fn: () => go(runSetup) },
      { label: 'Otra carrera', primary: true, fn: () => go(runGame, set) },
    ]), 500);
  }
  function lose() {
    stop(); sfx.bad();
    $('#say').textContent = '¡Gigante ha pillado a Nobita!';
    later(() => showModal(`<div class="big-art">${pic('gigante')}</div><h2>¡Te ha pillado!</h2>
      <p>Has acertado ${st.ok} ${st.ok === 1 ? 'vez' : 'veces'}. ${save.diff > 0 ? 'Prueba con la velocidad Tranquilo o ' : ''}¡Inténtalo otra vez!</p>`, [
      { label: 'Salir', fn: () => go(runSetup) },
      { label: 'Revancha', primary: true, fn: () => go(runGame, set) },
    ]), 500);
  }
  keyHandler = k => { const i = +k - 1, b = $('#opts').querySelectorAll('.opt')[i]; if (b && !b.disabled) b.click(); };
  cleanup = () => { st.running = false; cancelAnimationFrame(st.raf); };
  draw(); nextQ(); $('#opts').querySelectorAll('.opt').forEach(x => x.disabled = true); fitPlay($('#play'));
  st.t1 = later(() => { $('#say').textContent = '¡Ya!'; }, 900);
  st.t2 = later(() => { st.running = true; $('#opts').querySelectorAll('.opt').forEach(x => x.disabled = false); st.raf = requestAnimationFrame(loop); }, 1100);
}

/* ---------- Puertas mágicas (memoria) ---------- */
function memoSetup() {
  const s = screen(`<div><p class="eyebrow">Puertas mágicas</p><h2>¿Qué hay detrás de cada puerta?</h2>
    <p class="lead">Abre dos puertas. Si una tiene una multiplicación y la otra su resultado, se quedan abiertas. Recuerda lo que has visto para hacerlo en pocos intentos.</p></div>${pickerHTML()}`);
  bindPicker(s, set => go(memoGame, set));
}
function memoGame(set) {
  const facts = [], seen = new Set();
  for (const [a, b] of shuffle(pool(set))) { if (seen.has(a * b)) continue; seen.add(a * b); facts.push([a, b]); if (facts.length === 6) break; }
  while (facts.length < 6) { const [a, b] = pickFact('all'); if (!seen.has(a * b)) { seen.add(a * b); facts.push([a, b]); } }
  const cards = shuffle(facts.flatMap(([a, b], i) => [{ id: i, text: `${a} × ${b}`, a, b }, { id: i, text: String(a * b), a, b }]));
  const st = { open: [], matched: 0, tries: 0, lock: false };
  const s = screen(`<div class="row" style="justify-content:space-between"><p class="eyebrow">Puertas mágicas · ${setName(set)}</p><span class="hud"><span>Intentos: <b id="tries">0</b></span></span></div>
    <div class="doors" id="doors">${cards.map((_, i) => `<button class="door" data-i="${i}" aria-label="Puerta ${i + 1}"><span class="face"></span></button>`).join('')}</div>`, memoSetup, '← Elegir otra tabla');
  const btns = [...s.querySelectorAll('.door')];
  const face = (i, up) => { btns[i].classList.toggle('up', up); btns[i].querySelector('.face').textContent = up ? cards[i].text : ''; };
  btns.forEach((b, i) => b.addEventListener('click', () => {
    if (st.lock || b.classList.contains('up') || b.classList.contains('done')) return;
    sfx.flip(); face(i, true); st.open.push(i);
    if (st.open.length < 2) return;
    st.tries++; $('#tries').textContent = st.tries;
    const [x, y] = st.open; st.open = [];
    if (cards[x].id === cards[y].id) {
      [x, y].forEach(k => { btns[k].classList.remove('up'); btns[k].classList.add('done'); });
      rec(cards[x].a, cards[x].b, true); sfx.ok(); addDora(2); burst(btns[y], 2);
      if (++st.matched === 6) later(finish, 500);
    } else {
      st.lock = true;
      later(() => { face(x, false); face(y, false); st.lock = false; }, 1000);
    }
  }));
  cleanup = () => { st.lock = true; };
  function finish() {
    const stars = st.tries <= 8 ? 3 : st.tries <= 12 ? 2 : 1;
    const bonus = 5 + stars * 3;
    addDora(bonus); sfx.win();
    const medal = st.tries <= 10 ? giveMedal('memo') : '';
    showModal(`<div class="big-art">${G.puerta}</div><h2>¡Todas las puertas abiertas!</h2>${starsHTML(stars)}<p>Lo has conseguido en ${st.tries} intentos. Ganas ${bonus + 12} dorayakis.</p>${medal}`, [
      { label: 'Otra tabla', fn: () => go(memoSetup) },
      { label: 'Repetir', primary: true, fn: () => go(memoGame, set) },
    ]);
  }
}

/* ---------- Colección y mapa ---------- */
function collection() {
  screen(`<div><p class="eyebrow">El bolsillo mágico</p><h2>Mis inventos y medallas</h2><p class="lead">Cada viaje en el tiempo te da un invento de Doraemon. Las medallas se ganan en los otros juegos.</p></div>
    <h3>Inventos</h3><div class="coll">${ERAS.map((e, i) => `<div class="item ${save.eras[i] ? '' : 'locked'}">${G[e.g]}<h3>${save.eras[i] ? e.gn : '¿?'}</h3><p>${save.eras[i] ? e.gd : `Viaja a: ${e.n}`}</p>${save.eras[i] ? starsHTML(save.eras[i]) : ''}</div>`).join('')}</div>
    <h3>Medallas</h3><div class="coll">${MEDALS.map(m => `<div class="item ${save.medals[m.id] ? '' : 'locked'}">${G[m.g]}<h3>${m.n}</h3><p>${m.d}</p></div>`).join('')}</div>`);
}
function mapScreen() {
  let rows = '';
  for (let a = 1; a <= 10; a++) {
    rows += `<tr><th>${a}</th>${range(1, 10).map(b => `<td class="${mastery(a, b)}" title="${a} × ${b} = ${a * b}">${a * b}</td>`).join('')}</tr>`;
  }
  const weak = weakFacts();
  const s = screen(`<div><p class="eyebrow">Mapa de mis tablas</p><h2>¿Qué tablas me sé?</h2><p class="lead">Cada casilla es una multiplicación. Se colorea según cómo te sale cuando juegas.</p></div>
    <div class="panel map-wrap"><table class="map"><tr><th>×</th>${range(1, 10).map(b => `<th>${b}</th>`).join('')}</tr>${rows}</table></div>
    <div class="legend"><span><i style="background:var(--bell);border-color:var(--bell-deep)"></i>Me la sé</span><span><i style="background:var(--ok-bg);border-color:var(--ok)"></i>Casi</span><span><i style="background:var(--bad-bg);border-color:var(--bad)"></i>Me cuesta</span><span><i></i>Sin practicar</span></div>
    ${weak.length ? `<div class="panel center"><p style="margin:0 0 10px">Las que más te cuestan: <b>${weak.slice(0, 6).map(([a, b]) => `${a} × ${b}`).join(', ')}</b></p><button class="btn main" id="practice">Practicarlas con el pan de la memoria</button></div>` : ''}`);
  if (weak.length) $('#practice', s).onclick = () => go(train, 'weak');
}

renderHeader();
home();
</script>
