<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caballeros de las Tablas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: una sola columna centrada sobre un cielo estrellado; cada minijuego es una "pantalla" que sustituye a la anterior. Estética única y oscura (noche del Santuario), elegida a propósito. */
:root {
  color-scheme: dark;
  --night: #0a0f2c;
  --panel: #151b47;
  --panel-2: #1d2560;
  --line: #2e3884;
  --ink: #eef1ff;
  --muted: #aab2dc;
  --gold: #f4c652;
  --gold-deep: #c28a24;
  --cosmo: #7fd8ff;
  --fire: #ff8a4c;
  --ok: #6fe3a6;
  --bad: #ff6f86;
  --font-display: "Cinzel", "Trajan Pro", "Palatino Linotype", Georgia, serif;
  --font-body: "Nunito", "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
  --r: 14px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  overflow-x: hidden;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#app { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--cosmo); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: .02em; }

/* Cabecera */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 14px; }
.brand { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 10px; text-align: left; }
.brand-mark { width: 40px; height: 40px; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; color: var(--gold); display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: .9rem; }
.chip.cosmo { color: var(--cosmo); font-variant-numeric: tabular-nums; }
.chip.cosmo.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.18); box-shadow: 0 0 18px var(--cosmo); } }
.icon-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 1rem; }

/* Comunes */
.screen { display: grid; gap: 20px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: .4; transform: translateY(8px); } }
.panel { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.back { justify-self: start; background: none; border: 0; color: var(--muted); font-weight: 800; padding: 4px 0; }
.back:hover { color: var(--ink); }
.eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 900; }
.lead { color: var(--muted); max-width: 62ch; margin: 6px 0 0; }
.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 900; font-size: 1rem; background: var(--panel-2); border: 1px solid var(--line); }
.btn:hover { border-color: var(--cosmo); }
.btn.gold { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); color: #2a1a00; border-color: transparent; }
.btn.gold:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Portada */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; }
.hero h1 { font-size: clamp(1.7rem, 4.5vw, 2.6rem); line-height: 1.1; }
.hero h1 span { color: var(--gold); }
.rankbox { min-width: 0; }
.rank-name { font-family: var(--font-display); font-weight: 800; color: var(--gold); font-size: 1.1rem; }
.bar { height: 12px; border-radius: 999px; background: var(--night); border: 1px solid var(--line); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cosmo), #c8f1ff); border-radius: inherit; transition: width .5s ease; }
.bar.hp i { background: linear-gradient(90deg, var(--fire), var(--gold)); }
.bar-label { font-size: .85rem; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.armor-badge { width: 110px; height: 110px; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.mode { text-align: left; display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; transition: transform .15s ease, border-color .15s ease; }
.mode:hover { transform: translateY(-3px); border-color: var(--gold); }
.mode h3 { font-size: 1.15rem; color: var(--ink); }
.mode p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
.mode .art { width: 84px; height: 84px; }
.glyph-art { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--gold); color: var(--gold); font-size: 2.6rem; box-shadow: 0 0 22px color-mix(in srgb, var(--gold) 35%, transparent) inset; font-family: "Segoe UI Symbol", "Noto Sans Symbols", "DejaVu Sans", sans-serif; }
.extras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.extra { text-align: left; background: transparent; border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.extra:hover { border-color: var(--gold); }
.extra span { color: var(--muted); font-weight: 600; font-size: .9rem; }

/* Constelaciones */
.const line { stroke: var(--line); stroke-width: 1.3; stroke-linecap: round; }
.const circle { fill: var(--muted); }
.const.lit line { stroke: color-mix(in srgb, var(--gold) 70%, transparent); }
.const.lit circle { fill: var(--gold); filter: drop-shadow(0 0 3px var(--gold)); }
.const.cosmo line { stroke: color-mix(in srgb, var(--cosmo) 70%, transparent); }
.const.cosmo circle { fill: var(--cosmo); filter: drop-shadow(0 0 3px var(--cosmo)); }
.const.dim circle { fill: #4a538f; }
.const.dim line { stroke: #2a3270; }

/* Personajes */
.knight { display: block; width: 100%; height: auto; overflow: visible; }
.silhouette { filter: grayscale(1) brightness(.22); }
.athena-box { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: center; max-width: 360px; }
.athena-box .knight { filter: drop-shadow(0 0 14px color-mix(in srgb, var(--gold) 45%, transparent)); }
.bubble { position: relative; margin: 0; background: var(--night); border: 1px solid var(--gold-deep); border-radius: 14px; padding: 10px 12px; font-size: .9rem; color: var(--ink); }
.bubble b { display: block; color: var(--gold); font-family: var(--font-display); font-size: .85rem; margin-bottom: 2px; }
.portrait { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--gold); overflow: hidden; background: radial-gradient(circle at 50% 40%, var(--panel-2), var(--night)); display: block; }
.portrait .knight { width: 120%; margin: 4% 0 0 -10%; }
.modal-card .knight { width: 150px; margin: 0 auto; filter: drop-shadow(0 0 16px color-mix(in srgb, var(--gold) 50%, transparent)); }
.modal-card .duo { display: flex; justify-content: center; align-items: end; }
.modal-card .duo .knight { width: 120px; margin: 0; }
.hint-head { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--gold); }
.hint-head .portrait { width: 48px; height: 48px; }

/* Caballero del jugador */
.chip .mini { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; display: inline-block; margin: -4px 2px -4px -6px; background: var(--panel-2); }
.chip .mini .knight { width: 140%; margin: 2px 0 0 -20%; }
.me { display: flex; gap: 14px; align-items: center; }
.me-face { width: 92px; height: 92px; flex: none; padding: 0; cursor: pointer; }
.me-face:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--cosmo) 40%, transparent); }
.me-sub { margin: 4px 0 0; color: var(--muted); font-weight: 700; }
.link { background: none; border: 0; padding: 0; color: var(--cosmo); text-decoration: underline; font-weight: 800; }
.heroes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.hero-card { display: grid; justify-items: center; gap: 6px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 12px; transition: transform .15s ease, border-color .15s ease; }
.hero-card:hover { transform: translateY(-3px); border-color: var(--cosmo); }
.hero-card.chosen { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 30%, transparent); }
.hero-card .portrait { width: 120px; height: 120px; border-color: var(--cosmo); }
.hero-card b { font-family: var(--font-display); font-size: 1.15rem; }
.hero-card span:last-child { color: var(--muted); font-size: .9rem; }
.you { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--cosmo); font-size: .9rem; }
.you .portrait { width: 52px; height: 52px; border-color: var(--cosmo); }

/* Casas */
.houses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.house { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r) var(--r) 6px 6px; padding: 16px 10px 12px; text-align: center; display: grid; gap: 4px; justify-items: center; }
.house::before { content: ""; position: absolute; left: 10%; right: 10%; top: -1px; height: 4px; background: var(--gold-deep); border-radius: 0 0 4px 4px; }
.house:not(:disabled):hover { border-color: var(--gold); transform: translateY(-2px); }
.house:disabled { cursor: not-allowed; }
.house .face { width: 78px; height: 78px; }
.house .g { font-size: 1.1rem; color: var(--gold); line-height: 1; font-family: "Segoe UI Symbol", "Noto Sans Symbols", "DejaVu Sans", sans-serif; }
.house:disabled .g { color: #4a538f; }
.house .hn { font-family: var(--font-display); font-weight: 800; font-size: .95rem; }
.house .ht { font-size: .82rem; color: var(--muted); }
.house .num { position: absolute; top: 8px; left: 10px; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 1rem; }
.stars .off { color: #3b437e; }
.lock { font-size: .8rem; color: var(--muted); }
.house.next { border-color: var(--cosmo); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cosmo) 25%, transparent); }

/* Batalla */
.battle { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.guardian { display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: center; }
.guardian-art { position: relative; width: 130px; height: 130px; }
.guardian-art svg.const { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .45; }
.guardian-art .portrait { position: absolute; inset: 6px; width: auto; height: auto; box-shadow: 0 0 24px color-mix(in srgb, var(--gold) 40%, transparent); }
.guardian.hit .guardian-art { animation: shake .4s ease; }
.say { color: var(--muted); font-style: italic; font-size: .92rem; margin-top: 4px; }
.question { text-align: center; padding-block: 18px 6px; }
.q-text { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.1; font-variant-numeric: tabular-nums; }
.q-text .eq { color: var(--muted); }
.answer-box { display: inline-block; min-width: 2.6ch; border-bottom: 4px solid var(--gold); color: var(--gold); }
.answer-box.empty { color: transparent; }
.answer-box.empty::after { content: "?"; color: #4a538f; }
.shake { animation: shake .4s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.shields { display: flex; gap: 4px; }
.feedback { min-height: 1.5em; text-align: center; font-weight: 800; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.explain { background: color-mix(in srgb, var(--bad) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.explain b { color: var(--gold); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 340px; margin: 0 auto; width: 100%; }
.key { padding: 16px 0; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.key:hover { border-color: var(--cosmo); }
.key:active { transform: scale(.96); }
.key.ok { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); color: #2a1a00; border-color: transparent; font-size: 1.15rem; }
.key.alt { color: var(--muted); font-size: 1.2rem; }
.hint-note { text-align: center; color: var(--muted); font-size: .85rem; }

/* Pistas: cuadrícula de estrellas */
.star-grid { display: grid; gap: 3px; justify-content: center; }
.star-grid i { font-style: normal; color: var(--cosmo); font-size: 14px; line-height: 1; width: 16px; text-align: center; }
.skip { font-variant-numeric: tabular-nums; color: var(--ink); text-align: center; }
.skip span { color: var(--cosmo); font-weight: 900; }

/* Opciones del Coliseo */
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 460px; margin: 0 auto; width: 100%; }
.opt { padding: 18px 0; font-size: 1.8rem; font-weight: 900; border-radius: 14px; background: var(--panel-2); border: 2px solid var(--line); font-variant-numeric: tabular-nums; }
.opt:hover:not(:disabled) { border-color: var(--cosmo); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 20%, var(--panel-2)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 20%, var(--panel-2)); }
.opt:disabled { cursor: default; }
.picker { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.pick { padding: 14px 0; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font-weight: 900; font-size: 1.1rem; }
.pick small { display: block; font-size: .7rem; color: var(--muted); font-weight: 700; }
.pick:hover:not(:disabled) { border-color: var(--gold); }
.pick.wide { grid-column: span 5; }
.pick:disabled { opacity: .4; cursor: not-allowed; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.toggle button { background: transparent; border: 0; padding: 8px 14px; font-weight: 800; color: var(--muted); }
.toggle button[aria-pressed="true"] { background: var(--panel-2); color: var(--gold); }
.progress-dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.progress-dots i { width: 12px; height: 12px; border-radius: 50%; background: #2a3270; }
.progress-dots i.ok { background: var(--ok); }
.progress-dots i.bad { background: var(--bad); }
.progress-dots i.now { background: var(--gold); box-shadow: 0 0 8px var(--gold); }

/* Meteoros */
.sky-area { position: relative; height: 440px; border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; background: radial-gradient(ellipse at 50% 120%, color-mix(in srgb, var(--fire) 22%, transparent), transparent 55%), linear-gradient(180deg, #060a22, #111853); }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--gold-deep) 35%, transparent)); border-top: 1px dashed color-mix(in srgb, var(--gold) 40%, transparent); }
.meteor { position: absolute; top: 0; left: 0; padding: 8px 14px; border-radius: 999px; background: radial-gradient(circle at 30% 30%, #fff3d6, var(--fire) 60%, #b4410f); color: #2a0f00; font-weight: 900; font-size: 1.15rem; white-space: nowrap; box-shadow: 0 0 16px var(--fire); font-variant-numeric: tabular-nums; will-change: transform; }
.meteor::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 10px; height: 60px; transform: translateX(-50%); background: linear-gradient(0deg, color-mix(in srgb, var(--fire) 80%, transparent), transparent); border-radius: 6px; filter: blur(2px); }
.meteor.boom { animation: boom .35s ease forwards; }
@keyframes boom { to { transform: var(--pos) scale(1.8); opacity: 0; filter: brightness(2); } }
.ground-msg { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); background: color-mix(in srgb, var(--bad) 85%, #000); color: #fff; padding: 6px 12px; border-radius: 999px; font-weight: 900; white-space: nowrap; animation: fadeout 1.6s ease forwards; }
@keyframes fadeout { 70% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -14px); } }
.hud { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 900; font-variant-numeric: tabular-nums; }
.hud .lives { color: var(--bad); letter-spacing: 3px; }
.meteor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: stretch; }
.meteor-input { display: grid; gap: 14px; align-content: center; }
.meteor-input .key { padding: 11px 0; font-size: 1.3rem; }
.big-entry { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; text-align: center; color: var(--gold); border-bottom: 4px solid var(--gold); min-height: 1.4em; font-variant-numeric: tabular-nums; }
.start-overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: color-mix(in srgb, var(--night) 70%, transparent); padding: 16px; }

/* Memoria */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 620px; margin: 0 auto; width: 100%; }
.card { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: radial-gradient(circle at 50% 40%, var(--panel-2), var(--panel)); display: grid; place-items: center; font-weight: 900; font-size: clamp(1.1rem, 3.6vw, 1.7rem); font-variant-numeric: tabular-nums; position: relative; overflow: hidden; }
.card .back-face { color: #3b437e; font-size: 1.8rem; }
.card.up { background: var(--panel-2); border-color: var(--cosmo); }
.card.res.up { color: var(--gold); }
.card.done { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); cursor: default; }
.card.miss { animation: shake .4s ease; border-color: var(--bad); }
.pairs-stars { display: flex; justify-content: center; gap: 8px; font-size: 1.5rem; color: #3b437e; }
.pairs-stars .on { color: var(--gold); text-shadow: 0 0 10px var(--gold); }

/* Colección y mapa */
.collection { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.cloth { text-align: center; display: grid; gap: 4px; justify-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; }
.cloth svg.const { width: 72px; height: 72px; }
.cloth .portrait { width: 76px; height: 76px; }
.cloth b { font-size: .82rem; font-family: var(--font-display); }
.cloth span { font-size: .72rem; color: var(--muted); }
.cloth.locked b { color: var(--muted); }
.cloth.won { border-color: var(--gold-deep); }
.ranks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.rank { border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; font-size: .85rem; color: var(--muted); }
.rank b { display: block; font-family: var(--font-display); color: var(--ink); font-size: .9rem; }
.rank.have { border-color: var(--gold); }
.rank.have b { color: var(--gold); }
.tablewrap { overflow-x: auto; }
table.map { border-collapse: separate; border-spacing: 4px; margin: 0 auto; font-variant-numeric: tabular-nums; }
table.map th { color: var(--gold); font-family: var(--font-display); font-size: .95rem; width: 40px; height: 34px; }
table.map td { width: 44px; height: 38px; text-align: center; border-radius: 8px; font-weight: 800; font-size: .92rem; background: #1a2058; color: var(--muted); }
table.map td.m-gold { background: color-mix(in srgb, var(--gold) 75%, var(--night)); color: #2a1a00; }
table.map td.m-ok { background: color-mix(in srgb, var(--cosmo) 45%, var(--night)); color: var(--ink); }
table.map td.m-bad { background: color-mix(in srgb, var(--bad) 60%, var(--night)); color: #fff; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
.weak-list { display: flex; gap: 8px; flex-wrap: wrap; }
.weak-list span { background: color-mix(in srgb, var(--bad) 18%, var(--panel)); border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Modal y efectos */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, #02040f 72%, transparent); }
.modal-card { background: var(--panel); border: 1px solid var(--gold-deep); border-radius: 18px; padding: 24px; max-width: 440px; width: 100%; text-align: center; display: grid; gap: 14px; animation: rise .3s ease both; box-shadow: 0 0 60px color-mix(in srgb, var(--gold) 20%, transparent); }
.modal-card h2 { color: var(--gold); font-size: 1.6rem; }
.modal-card p { margin: 0; color: var(--muted); }
.modal-card .row { justify-content: center; }
.modal-card svg.const { width: 140px; height: 140px; margin: 0 auto; }
.big-stars { font-size: 2.4rem; color: var(--gold); letter-spacing: 6px; }
.big-stars .off { color: #3b437e; }
.name-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--night); color: var(--ink); font: inherit; font-size: 1.2rem; text-align: center; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; background: var(--gold); color: #2a1a00; font-weight: 900; padding: 10px 18px; border-radius: 999px; box-shadow: 0 6px 30px rgba(0,0,0,.4); animation: fadeout 3s ease forwards; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.spark { position: fixed; z-index: 25; pointer-events: none; color: var(--cosmo); font-size: 18px; animation: spark .8s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
.plus { position: fixed; z-index: 25; pointer-events: none; color: var(--cosmo); font-weight: 900; font-size: 1.3rem; animation: plus 1s ease-out forwards; text-shadow: 0 0 10px var(--cosmo); }
@keyframes plus { to { transform: translateY(-50px); opacity: 0; } }
.foot { text-align: center; color: var(--muted); font-size: .8rem; padding-top: 18px; }
.foot button { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: .8rem; }

@media (max-width: 760px) {
  .battle, .meteor-layout { grid-template-columns: 1fr; }
  .meteor-input { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); align-items: center; }
  .modes, .extras { grid-template-columns: 1fr; }
  .houses { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .collection { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ranks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: 1fr; }
  .athena-box { grid-template-columns: 96px minmax(0, 1fr); }
  .heroes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero-card .portrait { width: 96px; height: 96px; }
  .me-face { width: 72px; height: 72px; }
  .guardian { grid-template-columns: 96px 1fr; }
  .guardian-art { width: 96px; height: 96px; }
  .sky-area { height: 330px; }
}
@media (max-width: 440px) {
  .houses { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .picker { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .cards { gap: 8px; }
  .mode { grid-template-columns: 64px 1fr; }
  .mode .art, .mode .glyph-art { width: 64px; height: 64px; font-size: 2rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

const factKey = (a, b) => Math.min(a, b) + 'x' + Math.max(a, b);

function pool(set) {

}

function explain(a, b) {
  const r = a * b;
  const trick = (x, y) => {
    if (y === 1) return `Cualquier número por 1 da el mismo número: <b>${x} × 1 = ${x}</b>.`;
    if (y === 10) return `Por 10 solo añades un cero: ${x} → <b>${x * 10}</b>.`;
    if (y === 2) return `Por 2 es el doble: ${x} + ${x} = <b>${x * 2}</b>.`;
    if (y === 3) return `Por 3 es sumar tres veces: ${x} + ${x} + ${x} = <b>${x * 3}</b>.`;
    if (y === 4) return `Por 4 es el doble del doble: ${x} → ${x * 2} → <b>${x * 4}</b>.`;
    if (y === 5 && x !== 5) return `Por 5 es la mitad de por 10: ${x} × 10 = ${x * 10}, y la mitad es <b>${x * 5}</b>.`;
    if (y === 9) return `Por 9 es por 10 menos una vez: ${x} × 10 = ${x * 10}, menos ${x} = <b>${x * 9}</b>.`;
    return null;
  };
  const t = trick(a, b) || trick(b, a);
  if (t) return t;
  const big = Math.max(a, b), small = Math.min(a, b);
  if (small === 6 || big === 6) {
    const x = small === 6 ? big : small;
    return `Por 6 es por 5 y una vez más: ${x} × 5 = ${x * 5}, más ${x} = <b>${r}</b>.`;
  }
  if (small === 8 || big === 8) {
    const x = small === 8 ? big : small;
    return `Por 8 es doblar tres veces: ${x} → ${x * 2} → ${x * 4} → <b>${r}</b>.`;
  }
  return `Si ${big} × ${small - 1} = ${big * (small - 1)}, súmale otro ${big}: <b>${r}</b>.`;
}

    if (st.locked) { if (k === 'ok' && st.wrong) cont(); return; }
    if (k === 'del') st.entry = st.entry.slice(0, -1);
    else if (k === 'ok') { if (st.entry) submit(); return; }
    else if (st.entry.length < 3) st.entry += k;
    drawQ();
  }
  function submit() {
    const [a, b] = cur();
    if (+st.entry === a * b) {
      rec(a, b, true); sfx.ok();
      st.done++; st.queue.shift();
      fb.className = 'feedback ok'; fb.textContent = ['¡Golpe certero!', '¡Tu cosmos arde!', '¡Muy bien!', '¡Exacto!'][rnd(4)];
      $('#guardian').classList.remove('hit'); void s.offsetWidth; $('#guardian').classList.add('hit');
      burst(qEl, 10); addCosmo(10); drawHP();
      st.entry = '';
      if (!st.queue.length) return setTimeout(finish, 500);
      st.locked = true;
      setTimeout(() => { st.locked = false; fb.textContent = ''; drawQ(); }, 550);
      drawQ();
    } else {
      rec(a, b, false); sfx.bad(); st.errors++;
      qEl.classList.remove('shake'); void qEl.offsetWidth; qEl.classList.add('shake');
      fb.className = 'feedback bad'; fb.textContent = '¡El guardián ha bloqueado tu ataque!';
      st.locked = true; st.wrong = true;
      slot.innerHTML = `<div class="explain"><div><b>${a} × ${b} = ${a * b}</b></div><div>${explain(a, b)}</div>
        <button class="btn gold" id="cont">Entendido, ¡sigo!</button></div>`;
      $('#cont').onclick = cont;
      $('#cont').focus();
      drawHP();
    }
  }
  function cont() {
    const q = st.queue.shift();
    st.queue.splice(Math.min(3, st.queue.length), 0, q);
    st.entry = ''; st.locked = false; st.wrong = false; slot.innerHTML = ''; fb.textContent = '';
    drawQ();
  }
  function finish() {
    keyHandler = null;
    const stars = st.errors === 0 ? 3 : st.errors <= 2 ? 2 : 1;
    const first = !save.houses[i];
    save.houses[i] = Math.max(save.houses[i], stars); persist();
    const bonus = 30 * stars; addCosmo(bonus); sfx.win();
    const finale = i === 11;
    showModal(`<p class="eyebrow">Casa de ${h.name} conquistada</p>
      ${finale ? `<div class="duo">${knightSVG(i)}${athenaSVG()}</div>` : knightSVG(i)}
      <h2>${finale ? '¡Has llegado hasta Atenea!' : first ? '¡Armadura de Oro de ' + h.name + '!' : '¡Casa superada!'}</h2>
      ${finale ? '<p>Has cruzado las Doce Casas. Atenea te da las gracias: el Santuario está a salvo gracias a ti.</p>' : ''}
      <div class="big-stars">${[0, 1, 2].map(k => k < stars ? '★' : '<span class="off">★</span>').join('')}</div>
      <p>${st.errors === 0 ? 'Sin ningún error. ¡Perfecto!' : `Con ${st.errors} ${st.errors === 1 ? 'error' : 'errores'}. ${stars < 3 ? 'Repítela sin errores para lograr 3 estrellas.' : ''}`} Bonus: +${bonus} de cosmos.</p>`,
      [{ label: 'Repetir', fn: () => go(battle, i) },
       i < 11 ? { label: 'Siguiente casa →', primary: true, fn: () => go(battle, i + 1) } : { label: 'Ver mi colección', primary: true, fn: () => go(collection) }]);
  }
  bindKeypad(s, onKey);
  drawQ(); drawHP();
}

/* ---------- Selector de tabla ---------- */
function pickerHTML() {
  const w = weakFacts().length;
  return `<div class="picker">${range(1, 10).map(n => `<button class="pick" data-set="${n}"><small>Tabla del</small>${n}</button>`).join('')}
    <button class="pick wide" data-set="all">Todas mezcladas</button>
    <button class="pick wide" data-set="weak" ${w ? '' : 'disabled'}>Las que más me cuestan${w ? ` (${w})` : ' · aún no hay'}</button></div>`;
}
function bindPicker(s, fn) {
  s.querySelectorAll('.pick:not(:disabled)').forEach(b => b.onclick = () => {
    const v = b.dataset.set; fn(isNaN(+v) ? v : +v);
  });
}
const setLabel = set => typeof set === 'number' ? `Tabla del ${set}` : set === 'weak' ? 'Las que más me cuestan' : 'Todas mezcladas';

/* ---------- Entrenamiento ---------- */
let trainOrdered = true;
function trainSetup() {
  const s = screen(`<div><p class="eyebrow">Entrenamiento</p><h2>¿Qué tabla entrenamos?</h2>
    <p class="lead">Diez preguntas con cuatro respuestas para elegir. Si te atascas, pide una pista y verás la operación con estrellas.</p></div>
    <div class="row"><span>Orden de las preguntas:</span><span class="toggle"><button id="ord1" aria-pressed="${trainOrdered}">En orden</button><button id="ord2" aria-pressed="${!trainOrdered}">Salteadas</button></span></div>
    <div class="panel">${pickerHTML()}</div>`);
  $('#ord1').onclick = () => { trainOrdered = true; go(trainSetup); };
  $('#ord2').onclick = () => { trainOrdered = false; go(trainSetup); };
  bindPicker(s, set => go(train, set));
}
function options(a, b) {
  const r = a * b, set = new Set([r]);
  const cands = shuffle([a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, r + 1, r - 1, r + 2, r + 10, r - 10]);
  for (const c of cands) { if (set.size >= 4) break; if (c > 0 && c !== r) set.add(c); }
  let x = r + 3; while (set.size < 4) set.add(x++);
  return shuffle([...set]);
}
function train(set) {
  let qs;
  if (typeof set === 'number') { const ks = trainOrdered ? range(1, 10) : shuffle(range(1, 10)); qs = ks.map(k => [set, k]); }
  else qs = range(1, 10).map(() => pickFact(set));
  const st = { n: 0, res: [], hint: false };
  const s = screen(`<div><p class="eyebrow">Entrenamiento · ${setLabel(set)}</p></div>
    <div class="progress-dots" id="dots"></div>
    <div class="panel"><div class="question"><div class="q-text" id="q"></div></div>
      <p class="feedback" id="fb" aria-live="polite"></p>
      <div class="options" id="opts"></div>
      <div id="hint-slot" style="margin-top:14px; display:grid; gap:10px"></div>
      <div class="row" style="justify-content:center; margin-top:12px"><button class="btn" id="hint">💡 Pista</button><button class="btn gold" id="next" hidden>Siguiente →</button></div>
    </div>`, trainSetup, '← Elegir otra tabla');
  const qEl = $('#q', s), fb = $('#fb', s), opts = $('#opts', s), hs = $('#hint-slot', s);
  function dots() { $('#dots').innerHTML = qs.map((_, i) => `<i class="${st.res[i] === true ? 'ok' : st.res[i] === false ? 'bad' : i === st.n ? 'now' : ''}"></i>`).join(''); }
  function draw() {
    const [a, b] = qs[st.n];
    st.hint = false; hs.innerHTML = ''; fb.textContent = '';
    $('#hint').hidden = false; $('#next').hidden = true;
    qEl.innerHTML = `${a} × ${b} <span class="eq">=</span> <span class="answer-box empty"></span>`;
    opts.innerHTML = options(a, b).map(v => `<button class="opt" data-v="${v}">${v}</button>`).join('');
    opts.querySelectorAll('.opt').forEach(o => o.onclick = () => choose(o));
    dots();
  }
  function choose(o) {
    const [a, b] = qs[st.n], ok = +o.dataset.v === a * b;
    opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.v === a * b) x.classList.add('right'); });
    qEl.innerHTML = `${a} × ${b} <span class="eq">=</span> <span class="answer-box">${a * b}</span>`;
    rec(a, b, ok); st.res[st.n] = ok;
    if (ok) { sfx.ok(); const pts = st.hint ? 2 : 5; burst(o, pts); addCosmo(pts); fb.className = 'feedback ok'; fb.textContent = '¡Correcto!'; }
    else { sfx.bad(); o.classList.add('wrong'); fb.className = 'feedback bad'; fb.textContent = 'Casi. Mira el truco:'; hs.innerHTML = `<div class="explain"><div>${explain(a, b)}</div></div>`; }
    $('#hint').hidden = true; $('#next').hidden = false; $('#next').focus();
    dots();
  }
  $('#hint').onclick = () => {
    const [a, b] = qs[st.n]; st.hint = true;
    hs.innerHTML = `<div class="hint-head"><span class="portrait">${athenaSVG()}</span>Atenea te da una pista:</div>` + starGrid(a, b) + skipCount(a, b);
    $('#hint').hidden = true;
  };
  $('#next').onclick = () => {
    st.n++;
    if (st.n < qs.length) return draw();
    const good = st.res.filter(Boolean).length;
    if (good === qs.length) addCosmo(20);
    sfx.win();
    showModal(`<p class="eyebrow">Entrenamiento terminado</p><h2>${good} de ${qs.length}</h2>
      <p>${good === qs.length ? '¡Todas bien! Bonus de +20 de cosmos.' : good >= 7 ? '¡Muy buen entrenamiento! Un poco más y la dominas.' : 'Cada entrenamiento te hace más fuerte. ¡Otra vez!'}</p>`,
      [{ label: 'Otra tabla', fn: () => go(trainSetup) }, { label: 'Repetir', primary: true, fn: () => go(train, set) }]);
  };
  keyHandler = k => { const btns = opts.querySelectorAll('.opt'); if (k === 'ok' && !$('#next').hidden) $('#next').click(); else if (+k >= 1 && +k <= 4 && btns[+k - 1] && !btns[0].disabled) btns[+k - 1].click(); };
  draw();
}

/* ---------- Lluvia de meteoros ---------- */
function meteorSetup() {
  const s = screen(`<div><p class="eyebrow">Lluvia de meteoros</p><h2>Defiende el Santuario</h2>
    <p class="lead">Caen meteoros con operaciones. Escribe el resultado y pulsa Enter para destruirlos antes de que toquen el suelo. Tienes 3 vidas, y cada vez caen más rápido.</p></div>
    <div class="panel">${pickerHTML()}</div>`);
  bindPicker(s, set => go(meteorGame, set));
}
function meteorGame(set) {
  const s = screen(`<div class="hud"><span>${setLabel(set)}</span><span>Puntos: <b id="score">0</b> · Racha: <b id="combo">0</b></span><span class="lives" id="lives">♥♥♥</span></div>
    <div class="meteor-layout"><div class="sky-area" id="area"><div class="ground"></div>
      <div class="start-overlay" id="ov"><div style="display:grid;gap:12px;justify-items:center"><h2>¿Preparada?</h2><p class="lead">Escribe el resultado y pulsa Enter.</p><button class="btn gold" id="go">¡Empezar!</button></div></div></div>
    <div class="panel meteor-input"><div class="big-entry" id="entry"></div><div>${keypadHTML()}</div></div></div>`, meteorSetup, '← Elegir otra tabla');
  const area = $('#area', s), entryEl = $('#entry', s);
  const st = { m: [], entry: '', lives: 3, score: 0, combo: 0, killed: 0, last: 0, prev: 0, running: false, raf: 0, spawnAt: 0 };
  const H = () => area.clientHeight, W = () => area.clientWidth;
  function hud() { $('#score').textContent = st.score; $('#combo').textContent = st.combo; $('#lives').textContent = '♥'.repeat(st.lives) + '♡'.repeat(3 - st.lives); entryEl.textContent = st.entry; }
  function spawn() {
    const [a, b] = pickFact(set);
    const el = document.createElement('div'); el.className = 'meteor'; el.textContent = `${a} × ${b}`;
    area.appendChild(el);
    const x = 8 + Math.random() * Math.max(10, W() - el.offsetWidth - 16);
    const fall = Math.max(5, 12 - st.killed * 0.18);
    st.m.push({ a, b, el, x, y: -40, v: (H() + 40) / fall });
  }
  function loop(ts) {
    if (!st.running) return;
    const dt = Math.min(0.05, (ts - (st.prev || ts)) / 1000); st.prev = ts;
    st.spawnAt -= dt;
    if (st.spawnAt <= 0 && st.m.length < 5) { spawn(); st.spawnAt = Math.max(1.4, 3.2 - st.killed * 0.06); }
    const floor = H() - 34 - 36;
    for (const m of st.m.slice()) {
      m.y += m.v * dt;
      const pos = `translate(${m.x}px, ${m.y}px)`;
      m.el.style.transform = pos; m.el.style.setProperty('--pos', pos);
      if (m.y >= floor) {
        st.m.splice(st.m.indexOf(m), 1); m.el.remove();
        rec(m.a, m.b, false); sfx.bad();
        st.lives--; st.combo = 0;
        const msg = document.createElement('div'); msg.className = 'ground-msg'; msg.textContent = `${m.a} × ${m.b} = ${m.a * m.b}`;
        area.appendChild(msg); setTimeout(() => msg.remove(), 1700);
        hud();
        if (st.lives <= 0) return end();
      }
    }
    st.raf = requestAnimationFrame(loop);
  }
  function start() {
    $('#ov').hidden = true; st.running = true; st.spawnAt = 0.3; st.prev = 0;
    st.raf = requestAnimationFrame(loop);
  }
  function submit() {
    const v = +st.entry; st.entry = '';
    const hits = st.m.filter(m => m.a * m.b === v).sort((p, q) => q.y - p.y);
    if (hits.length) {
      const m = hits[0];
      st.m.splice(st.m.indexOf(m), 1);
      m.el.classList.add('boom'); setTimeout(() => m.el.remove(), 360);
      rec(m.a, m.b, true); sfx.boom();
      st.combo++; st.killed++;
      const pts = 10 + Math.min(st.combo - 1, 5) * 2; st.score += pts;
      burst(m.el, pts);
    } else {
      st.combo = 0; sfx.bad();
      entryEl.classList.remove('shake'); void entryEl.offsetWidth; entryEl.classList.add('shake');
    }
    hud();
  }
  function end() {
    st.running = false; cancelAnimationFrame(st.raf); keyHandler = null;
    const best = st.score > save.bestMeteor;
    if (best) { save.bestMeteor = st.score; persist(); }
    if (st.score) addCosmo(st.score);
    sfx.win();
    showModal(`<p class="eyebrow">Fin de la lluvia</p><h2>${st.score} puntos</h2>
      <p>Has destruido ${st.killed} ${st.killed === 1 ? 'meteoro' : 'meteoros'}. ${best ? '¡Nuevo récord!' : `Tu récord es ${save.bestMeteor}.`} Ganas +${st.score} de cosmos.</p>`,
      [{ label: 'Salir', fn: () => go(home) }, { label: 'Jugar otra vez', primary: true, fn: () => go(meteorGame, set) }]);
  }
  bindKeypad(s, k => {
    if (!st.running) { if (k === 'ok' && !$('#ov').hidden) start(); return; }
    if (k === 'del') st.entry = st.entry.slice(0, -1);
    else if (k === 'ok') { if (st.entry) submit(); return; }
    else if (st.entry.length < 3) st.entry += k;
    hud();
  });
  $('#go').onclick = start;
  const onVis = () => { if (document.hidden) st.prev = 0; };
  document.addEventListener('visibilitychange', onVis);
  cleanup = () => { st.running = false; cancelAnimationFrame(st.raf); document.removeEventListener('visibilitychange', onVis); };
  hud();
}

/* ---------- Constelaciones gemelas (memoria) ---------- */
function memorySetup() {
  const s = screen(`<div><p class="eyebrow">Constelaciones gemelas</p><h2>Encuentra las parejas</h2>
    <p class="lead">Da la vuelta a dos cartas. Si una operación y su resultado coinciden, se quedan boca arriba. Completa el tablero para ganar una armadura de bronce.</p></div>
    <div class="panel">${pickerHTML()}</div>`);
  bindPicker(s, set => go(memoryGame, set));
}
function memoryFacts(set) {
  const out = [], used = new Set();
  const p = shuffle(pool(set).map(([a, b]) => Math.random() < .5 || typeof set === 'number' ? [a, b] : [b, a]));
  for (const [a, b] of p) { if (out.length >= 6) break; if (!used.has(a * b)) { used.add(a * b); out.push([a, b]); } }
  while (out.length < 6) { const a = 2 + rnd(9), b = 2 + rnd(9); if (!used.has(a * b)) { used.add(a * b); out.push([a, b]); } }
  return out;
}
function memoryGame(set) {
  const facts = memoryFacts(set);
  const cards = shuffle(facts.flatMap(([a, b], id) => [{ id, kind: 'op', text: `${a} × ${b}` }, { id, kind: 'res', text: String(a * b) }]));
  const st = { open: [], matched: 0, moves: 0, lock: false };
  const s = screen(`<div class="hud"><span>${setLabel(set)}</span><span>Intentos: <b id="moves">0</b></span></div>
    <div class="pairs-stars" id="ps">${facts.map(() => '<span>✦</span>').join('')}</div>
    <div class="cards">${cards.map((c, i) => `<button class="card ${c.kind}" data-i="${i}" aria-label="Carta ${i + 1}"><span class="back-face">✧</span></button>`).join('')}</div>`, memorySetup, '← Elegir otra tabla');
  const btns = [...s.querySelectorAll('.card')];
  btns.forEach(b => b.onclick = () => flip(+b.dataset.i));
  function face(i, up) { const c = cards[i], b = btns[i]; b.classList.toggle('up', up); b.innerHTML = up ? c.text : '<span class="back-face">✧</span>'; }
  function flip(i) {
    if (st.lock || cards[i].done || st.open.includes(i)) return;
    sfx.flip(); face(i, true); st.open.push(i);
    if (st.open.length < 2) return;
    st.moves++; $('#moves').textContent = st.moves;
    const [x, y] = st.open, cx = cards[x], cy = cards[y];
    if (cx.id === cy.id && cx.kind !== cy.kind) {
      cx.done = cy.done = true; st.open = [];
      btns[x].classList.add('done'); btns[y].classList.add('done');
      const [a, b] = facts[cx.id]; rec(a, b, true);
      st.matched++; $('#ps').children[st.matched - 1].className = 'on';
      sfx.ok(); burst(btns[y], 15); addCosmo(15);
      if (st.matched === facts.length) setTimeout(finish, 500);
    } else {
      st.lock = true;
      btns[x].classList.add('miss'); btns[y].classList.add('miss');
      setTimeout(() => { btns[x].classList.remove('miss'); btns[y].classList.remove('miss'); face(x, false); face(y, false); st.open = []; st.lock = false; }, 1000);
    }
  }
  function finish() {
    addCosmo(50); sfx.win();
    let prize = '';
    if (save.bronze < BRONZE.length) {
      const c = BRONZE[save.bronze]; save.bronze++; persist();
      prize = `${constSVG(c, 'cosmo')}<h2>¡Constelación de ${c.name}!</h2>`;
    } else prize = '<h2>¡Tablero completado!</h2>';
    showModal(`<p class="eyebrow">Constelación completa</p>${prize}<p>Lo has conseguido en ${st.moves} intentos. +50 de cosmos.</p>`,
      [{ label: 'Salir', fn: () => go(home) }, { label: 'Jugar otra vez', primary: true, fn: () => go(memoryGame, set) }]);
  }
}

  screen(`<div><p class="eyebrow">Mi colección</p><h2>Armaduras conseguidas</h2>
    <p class="lead">Las armaduras de oro se ganan conquistando las Doce Casas. Las constelaciones de bronce, completando tableros de Constelaciones gemelas.</p></div>
    <div class="panel" style="display:grid;gap:12px"><h3>Rango de cosmos</h3>

}

/* ---------- Mapa de tablas ---------- */
function mapScreen() {
  const weak = weakFacts();
  const s = screen(`<div><p class="eyebrow">Mapa de mis tablas</p><h2>¿Qué sé y qué me cuesta?</h2>
    <p class="lead">Cada casilla es una multiplicación. Se va coloreando según aciertas o fallas en cualquier juego.</p></div>
    <div class="panel" style="display:grid;gap:14px">
      <div class="tablewrap"><table class="map"><tr><th>×</th>${range(1, 10).map(n => `<th>${n}</th>`).join('')}</tr>
        ${range(1, 10).map(a => `<tr><th>${a}</th>${range(1, 10).map(b => `<td class="${mastery(a, b)}" title="${a} × ${b}">${a * b}</td>`).join('')}</tr>`).join('')}</table></div>
      <div class="legend"><span><i style="background:#1a2058"></i>Sin practicar</span><span><i style="background:var(--bad)"></i>Me cuesta</span><span><i style="background:var(--cosmo)"></i>Casi la sé</span><span><i style="background:var(--gold)"></i>Dominada</span></div>
    </div>

      ${weak.length ? `<div class="weak-list">${weak.map(([a, b]) => `<span>${a} × ${b} = ${a * b}</span>`).join('')}</div>
        <div class="row"><button class="btn gold" id="pw">Entrenar estas</button><button class="btn" id="mw">Meteoros con estas</button></div>`
        : '<p class="lead" style="margin:0">Todavía no hay ninguna. ¡Juega un poco y aquí aparecerán las que conviene repasar!</p>'}
    </div>`);
  if (weak.length) { $('#pw', s).onclick = () => go(train, 'weak'); $('#mw', s).onclick = () => go(meteorGame, 'weak'); }
}

/* ---------- Cielo estrellado ---------- */
(function sky() {
  const c = $('#sky'), x = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [];
  function size() {
    c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 5000) }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, r: (Math.random() * 1.3 + .3) * devicePixelRatio, p: Math.random() * 6.28, s: .5 + Math.random() * 1.5 }));
  }
  function draw(t) {
    x.clearRect(0, 0, c.width, c.height);
    const g = x.createRadialGradient(c.width * .8, c.height * .1, 0, c.width * .8, c.height * .1, c.width * .7);
    g.addColorStop(0, 'rgba(90,70,190,.25)'); g.addColorStop(1, 'rgba(10,15,44,0)');
    x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
    for (const s of stars) {
      x.globalAlpha = .35 + .65 * Math.abs(Math.sin(s.p + t / 1000 * s.s));
      x.fillStyle = '#e8ecff'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill();
    }
    x.globalAlpha = 1;
    if (!still) requestAnimationFrame(draw);
  }
  size(); addEventListener('resize', () => { size(); if (still) draw(0); });
  requestAnimationFrame(draw);
})();

renderHeader();
go(home);
